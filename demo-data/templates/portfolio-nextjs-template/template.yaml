apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: portfolio-nextjs-template
  title: Portfolio Next.js
  description: Golden Path pour générer une application Portfolio Next.js avec Docker et GitHub
  tags:
    - nextjs
    - react
    - docker
    - platform-engineering
    - github

spec:
  owner: team-payments
  type: website

  parameters:
    - title: Informations du Portfolio
      required:
        - componentName
        - repoUrl
      properties:
        componentName:
          title: Nom du projet
          type: string
          description: Nom du dépôt et du composant Backstage
          default: portfolio-nextjs
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'

        description:
          title: Description
          type: string
          default: Portfolio professionnel développé avec Next.js

        owner:
          title: Équipe responsable
          type: string
          default: team-payments

        repoUrl:
          title: Dépôt GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Génération du projet Next.js
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentName: ${{ parameters.componentName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publication sur GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        sourcePath: .

    - id: register
      name: Enregistrement dans le Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Ouvrir le dépôt GitHub
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ouvrir le composant dans Backstage
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

    text:
      - title: Portfolio généré et publié
        content: >-
          Le projet ${{ parameters.componentName }} a été généré,
          publié sur GitHub et enregistré dans le Software Catalog.
