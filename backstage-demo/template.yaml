apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-golden-path-template
  title: Microservice Node.js / Express Paved Road
  description: Template officiel de Ferid Saad avec TypeScript, Docker, CI/CD GitHub Actions, ArgoCD et OpenTelemetry
  tags:
    - recommended
    - nodejs
    - typescript
    - paved-road
spec:
  owner: platform-team
  type: service

  parameters:
    - title: 1. Informations sur le Composant
      required:
        - component_id
        - description
        - owner
      properties:
        component_id:
          title: Nom du service
          type: string
          description: Nom unique en minuscules (ex: order-service)
        description:
          title: Description fonctionnelle
          type: string
          description: Résumé de la responsabilité métier du composant
        owner:
          title: Équipe Propriétaire
          type: string
          description: Squad en charge de la maintenance
          ui:field: OwnerPicker

    - title: 2. Options d'Architecture & Persistance
      properties:
        database:
          title: Type de Base de Données
          type: string
          default: postgresql
          enum:
            - postgresql
            - redis
            - none
          enumNames:
            - PostgreSQL Managée (AWS Aurora)
            - Redis Cache Cluster
            - Aucune (Stateless)

  steps:
    - id: template
      name: Génération du code source
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          database: ${{ parameters.database }}

    - id: publish
      name: Création et publication sur GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.component_id }}&owner=ferid-saad
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Déclaration automatique dans Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Dépôt GitHub Source
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ouvrir dans le Catalogue
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
